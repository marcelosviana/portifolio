<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Gradiente Sutil e Futurista: Sky-400 para Indigo-500 -->
    <linearGradient id="mvGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="mvGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Letra M: Estrutura Arquitetural Minimalista -->
  <polyline points="105,385 105,140 256,290 407,140 407,385" 
            stroke="url(#mvGrad1)" 
            stroke-width="38" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

  <!-- Letra V: Chevron Intertravado com a Base -->
  <polyline points="165,240 256,395 347,240" 
            stroke="url(#mvGrad2)" 
            stroke-width="38" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

  <!-- Núcleo Tecnológico Central (Sensoriamento & IoT) -->
  <circle cx="256" cy="195" r="15" fill="#38bdf8" filter="url(#subtleGlow)" />
</svg>
